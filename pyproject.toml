[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vchain"
version = "1.0.0"
description = "Blockchain-verified IoT cold-chain telemetry for vaccine transport"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "paho-mqtt>=2.0",
    "amqtt>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
vchain = "vchain.__main__:main"

[tool.setuptools]
packages = ["vchain"]

[tool.setuptools.package-data]
vchain = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
